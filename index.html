<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGreen Energy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-container">
            <img src="https://igreenenergyteam.com.br/wp-content/uploads/2023/08/Ativo-4.png" alt="Logo iGreen Energy" class="logo">
            
            <nav class="desktop-nav">
                <a href="#" onclick="navegar('inicio')">INÍCIO</a>
                <a href="#" onclick="navegar('sobre')">SOBRE</a>
                <a href="#" onclick="navegar('produtos')">PRODUTOS</a>
                <a href="#" onclick="navegar('contato')">CONTATO</a>
                <a href="https://blog.igreenenergy.com.br" target="_blank">NOVIDADES</a> </nav>

            <div class="mobile-menu-icon" onclick="toggleMobileMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
        
        <div class="mobile-nav" id="mobileNav">
            <a href="#" onclick="navegar('inicio'); toggleMobileMenu()">INÍCIO</a>
            <a href="#" onclick="navegar('sobre'); toggleMobileMenu()">SOBRE</a>
            <a href="#" onclick="navegar('produtos'); toggleMobileMenu()">PRODUTOS</a>
            <a href="#" onclick="navegar('contato'); toggleMobileMenu()">CONTATO</a>
            <a href="https://blog.igreenenergy.com.br" target="_blank">NOVIDADES</a>
        </div>
    </header>

    <main id="main-content">
        </main>

    <div id="product-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharModalProduto()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="chat-trigger" onclick="toggleChat()">
        <i class="fa-solid fa-comment-dots"></i>
    </div>

    <div id="chat-container" class="chat-container hidden">
        <div class="chat-header">
            <div class="chat-header-left">
                <i class="fa-solid fa-arrow-left mobile-back" onclick="toggleChat()"></i>
                <div class="bot-avatar-wrapper">
                    <img src="https://c.topshort.org/aifacefy/ai_face_generator/template/1.webp" alt="Bot Avatar">
                </div>
                <span class="bot-name">Assistente iGreen</span>
            </div>
            <div class="chat-header-right">
                <i class="fa-solid fa-rotate-right" onclick="reiniciarChat()" title="Reiniciar Conversa"></i>
            </div>
        </div>

        <div class="chat-body" id="chat-body">
            </div>

        <div class="chat-input-area">
            <div class="custom-select-wrapper" onclick="toggleOpcoes()">
                <div class="custom-select-trigger">
                    <span id="select-text">Escolha uma opção...</span>
                    <i class="fa-solid fa-chevron-up"></i>
                </div>
                <div class="custom-options" id="custom-options">
                    </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
